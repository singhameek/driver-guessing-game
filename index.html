<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="styles.css">
        <title class = "title">Guess that F1 Driver!</title>
    </head>
    <body class = "body">
        <h1 class = "title">Guess that F1 driver!</h1>
        <h3 class = "subheader">In this game, you need to guess the current F1 driver by their driver number!</h3>
        <p class = "text">You'll be presented a driver number, and four choices from which you must select the driver.</p>

        <div id="number" class="number">?</div>
        <div class="choices">
            <button class="choice" id="btn-0"></button>
            <button class="choice" id="btn-1"></button>
            <button class="choice" id="btn-2"></button>
            <button class="choice" id="btn-3"></button>
        </div>

        <p id="result" class="text"></p>
        <script src="script.js"></script>
    </body>
</html>
